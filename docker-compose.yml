services:
  app:
    build: .
    container_name: tcf-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: tcf-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - tcf-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      retries: 5

volumes:
  tcf-db-data:
